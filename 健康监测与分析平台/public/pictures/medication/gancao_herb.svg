<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)" rx="12"/>
  <rect x="20" y="20" width="560" height="360" fill="#ffffff" stroke="#a16207" stroke-width="3" rx="8"/>
  <text x="300" y="65" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#713f12">甘草饮片</text>
  <text x="300" y="100" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#854d0e">Glycyrrhizae Radix et Rhizoma</text>
  <line x1="60" y1="125" x2="540" y2="125" stroke="#a16207" stroke-width="2"/>
  <text x="60" y="165" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【来源】豆科植物甘草的干燥根</text>
  <text x="60" y="200" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【性味归经】甘，平。归心、肺、脾、胃经</text>
  <text x="60" y="235" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【功能主治】补脾益气，清热解毒</text>
  <text x="60" y="270" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#854d0e">用于脾胃虚弱，倦怠乏力，咳嗽痰多</text>
  <text x="60" y="305" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【用法用量】煎服，2-10g</text>
  <text x="60" y="340" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【禁忌】不宜与京大戟、甘遂同用</text>
  <rect x="400" y="280" width="160" height="80" fill="#a16207" rx="6"/>
  <text x="480" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#ffffff">中药材</text>
  <text x="480" y="340" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">一级品</text>
  <text x="300" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">250g/袋 · 置阴凉干燥处 · 中药饮片</text>
</svg>
