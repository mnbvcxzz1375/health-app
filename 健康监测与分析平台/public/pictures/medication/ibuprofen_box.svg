<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="12"/>
  <rect x="20" y="20" width="560" height="360" fill="#ffffff" stroke="#0284c7" stroke-width="3" rx="8"/>
  <text x="300" y="70" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#0c4a6e">布洛芬缓释胶囊</text>
  <text x="300" y="110" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#075985">Ibuprofen Sustained-Release Capsules</text>
  <line x1="60" y1="140" x2="540" y2="140" stroke="#0284c7" stroke-width="2"/>
  <text x="60" y="180" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#0c4a6e">【规格】0.3g</text>
  <text x="60" y="215" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#0c4a6e">【用法用量】口服，成人一次1粒，一日2次</text>
  <text x="60" y="250" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#0c4a6e">【适应症】缓解轻至中度疼痛</text>
  <text x="60" y="285" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#075985">用于头痛、关节痛、肌肉痛、牙痛</text>
  <text x="60" y="320" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【不良反应】偶见恶心、胃灼热</text>
  <rect x="380" y="280" width="180" height="80" fill="#0284c7" rx="6"/>
  <text x="470" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#ffffff">国药准字</text>
  <text x="470" y="340" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">H10900089</text>
  <text x="300" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">24粒/盒 · 密封保存 · 请置于儿童不易触及处</text>
</svg>
