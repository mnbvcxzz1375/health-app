<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)" rx="12"/>
  <rect x="20" y="20" width="560" height="360" fill="#ffffff" stroke="#be185d" stroke-width="3" rx="8"/>
  <text x="300" y="70" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#831843">桑菊感冒片</text>
  <text x="300" y="110" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#9d174d">Sangju Ganmao Pian</text>
  <line x1="60" y1="140" x2="540" y2="140" stroke="#be185d" stroke-width="2"/>
  <text x="60" y="180" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#831843">【成分】桑叶、菊花、连翘、薄荷</text>
  <text x="60" y="215" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#831843">【用法用量】口服，一次4-8片，一日2-3次</text>
  <text x="60" y="250" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#831843">【功能主治】疏风清热，宣肺止咳</text>
  <text x="60" y="285" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#9d174d">用于风热感冒初起，头痛咳嗽，咽痛</text>
  <text x="60" y="320" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【禁忌】风寒感冒者不宜使用</text>
  <rect x="380" y="280" width="180" height="80" fill="#be185d" rx="6"/>
  <text x="470" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#ffffff">国药准字</text>
  <text x="470" y="340" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Z11020392</text>
  <text x="300" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">48片/盒 · 密封保存 · 中成药</text>
