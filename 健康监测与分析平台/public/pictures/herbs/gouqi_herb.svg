<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg_gouqi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_gouqi)" rx="12"/>
  <rect x="20" y="20" width="560" height="360" fill="#ffffff" stroke="#a16207" stroke-width="3" rx="8"/>
  <text x="300" y="65" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#713f12">枸杞子</text>
  <text x="300" y="100" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#854d0e">Lycii Fructus</text>
  <line x1="60" y1="125" x2="540" y2="125" stroke="#a16207" stroke-width="2"/>
  <text x="60" y="165" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【来源】茄科植物宁夏枸杞的干燥成熟果实</text>
  <text x="60" y="200" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【性味归经】甘，平。归肝、肾经</text>
  <text x="60" y="235" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【功能主治】滋补肝肾，益精明目</text>
  <text x="60" y="270" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#854d0e">用于虚劳精亏，腰膝酸痛，眩晕耳鸣，目昏不明</text>
  <text x="60" y="305" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【用法用量】煎服，6-12g</text>
  <text x="60" y="340" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【禁忌】外感实热者不宜</text>
  <rect x="400" y="280" width="160" height="80" fill="#a16207" rx="6"/>
  <text x="480" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#ffffff">中药材</text>
  <text x="480" y="340" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">特级品</text>
  <text x="300" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">500g/袋 · 置阴凉干燥处 · 中药饮片</text>
</svg>
