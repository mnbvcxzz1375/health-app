<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg_danggui" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_danggui)" rx="12"/>
  <rect x="20" y="20" width="560" height="360" fill="#ffffff" stroke="#a16207" stroke-width="3" rx="8"/>
  <text x="300" y="65" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#713f12">当归</text>
  <text x="300" y="100" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#854d0e">Angelicae Sinensis Radix</text>
  <line x1="60" y1="125" x2="540" y2="125" stroke="#a16207" stroke-width="2"/>
  <text x="60" y="165" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【来源】伞形科植物当归的干燥根</text>
  <text x="60" y="200" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【性味归经】甘、辛，温。归肝、心、脾经</text>
  <text x="60" y="235" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#713f12">【功能主治】补血活血，调经止痛，润肠通便</text>
  <text x="60" y="270" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#854d0e">用于血虚萎黄，月经不调，经闭痛经，虚寒腹痛</text>
  <text x="60" y="305" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【用法用量】煎服，6-12g</text>
  <text x="60" y="340" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">【禁忌】湿盛中满、大便溏泄者不宜</text>
  <rect x="400" y="280" width="160" height="80" fill="#a16207" rx="6"/>
  <text x="480" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#ffffff">中药材</text>
  <text x="480" y="340" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">一级品</text>
  <text x="300" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">250g/袋 · 置阴凉干燥处 · 中药饮片</text>
</svg>
