﻿/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {

  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-200);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --apple-radius-sm: 0.5rem;
  --apple-radius-md: 0.75rem;
  --apple-radius-lg: var(--radius);
  --apple-radius-xl: calc(var(--radius) * 1.25);
  --radius-sm: 0.5rem;
  --radius-md: 0.75rem;
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) * 1.25);

  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

      <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" role="img" aria-label="用户头像" style="background:var(--brand-50);">
        <span class="text-[18px] font-semibold" style="color:var(--brand-500);">张</span>
      </div>
    </header>

    <!-- 2. Health Score Ring -->
    <section class="flex flex-col items-center mt-8">
      <div style="width:160px;height:160px;border-radius:9999px;background:conic-gradient(var(--brand-500) 0deg 313.2deg, var(--background-200) 313.2deg);display:flex;align-items:center;justify-content:center;">
        <div style="width:128px;height:128px;border-radius:9999px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
          <span style="font-size:48px;font-weight:600;color:var(--foreground);font-variant-numeric:tabular-nums;line-height:1;">87</span>
          <span style="font-size:13px;color:var(--muted-foreground);">健康评分</span>
        </div>
      </div>
      <div class="mt-3 inline-flex items-center gap-1 px-2.5 py-1 rounded-full">
        <i data-lucide="trending-up" class="w-3 h-3" style="color:var(--state-success);"></i>
        <span class="text-[12px] font-medium whitespace-nowrap" style="color:var(--state-success);background:var(--state-success-surface);">较上周 +3</span>
      </div>
    </section>

    <!-- 3. Key Metrics Row -->
    <section class="flex gap-2 mt-6">
      <div class="flex-1 min-w-0 p-[14px] rounded-2xl" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
        <i data-lucide="heart-pulse" class="w-5 h-5" style="color:var(--state-error);"></i>
        <div class="mt-2 flex items-baseline gap-1">
          <span class="text-[24px] font-semibold" style="color:var(--foreground);font-variant-numeric:tabular-nums;">72</span>
          <span class="text-[12px]" style="color:var(--muted-foreground);">bpm</span>
        </div>
        <span class="text-[13px] block truncate" style="color:var(--muted-foreground);">心率</span>
      </div>
      <div class="flex-1 min-w-0 p-[14px] rounded-2xl" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
        <i data-lucide="moon" class="w-5 h-5" style="color:var(--chart-4);"></i>
        <div class="mt-2 flex items-baseline gap-1">
          <span class="text-[24px] font-semibold" style="color:var(--foreground);font-variant-numeric:tabular-nums;">7.5</span>
          <span class="text-[12px]" style="color:var(--muted-foreground);">h</span>
        </div>
        <span class="text-[13px] block truncate" style="color:var(--muted-foreground);">睡眠</span>
      </div>
      <div class="flex-1 min-w-0 p-[14px] rounded-2xl" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
        <i data-lucide="footprints" class="w-5 h-5" style="color:var(--brand-500);"></i>
        <div class="mt-2 flex items-baseline gap-1">
          <span class="text-[24px] font-semibold" style="color:var(--foreground);font-variant-numeric:tabular-nums;">8,240</span>
          <span class="text-[12px]" style="color:var(--muted-foreground);">步</span>
        </div>
        <span class="text-[13px] block truncate" style="color:var(--muted-foreground);">步数</span>
      </div>
    </section>

    <!-- 4. Today's Plan Card -->
    <section class="mt-3 p-[18px] rounded-[19.2px]" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
      <div class="flex items-center justify-between">
        <h2 class="text-[17px] font-semibold" style="color:var(--foreground);">今日计划</h2>
        <span class="text-[13px]" style="color:var(--muted-foreground);font-variant-numeric:tabular-nums;">2/4 完成</span>
      </div>
      <div class="mt-3" style="height:1px;background:var(--border);"></div>
      <div class="flex items-center gap-3 py-3">
        <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0" role="img" aria-label="已完成" style="background:var(--state-success);">
          <i data-lucide="check" class="w-3.5 h-3.5" style="color:var(--state-success-foreground);"></i>
        </div>
        <i data-lucide="pill" class="w-5 h-5 shrink-0" style="color:var(--muted-foreground);"></i>
        <span class="flex-1 min-w-0 text-[15px] truncate" style="color:var(--foreground);">服用降压药</span>
        <span class="text-[13px] shrink-0 whitespace-nowrap" style="color:var(--muted-foreground);font-variant-numeric:tabular-nums;">08:00</span>
      </div>
      <div class="flex items-center gap-3 py-3">
        <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0" role="img" aria-label="已完成" style="background:var(--state-success);">
          <i data-lucide="check" class="w-3.5 h-3.5" style="color:var(--state-success-foreground);"></i>
        </div>
        <i data-lucide="dumbbell" class="w-5 h-5 shrink-0" style="color:var(--muted-foreground);"></i>
        <span class="flex-1 min-w-0 text-[15px] truncate" style="color:var(--foreground);">康复训练</span>
        <span class="text-[13px] shrink-0 whitespace-nowrap" style="color:var(--muted-foreground);font-variant-numeric:tabular-nums;">10:00</span>
      </div>
      <div class="flex items-center gap-3 py-3">
        <div class="w-6 h-6 rounded-full shrink-0" role="img" aria-label="未完成" style="border:1px solid var(--border);"></div>
        <i data-lucide="pill" class="w-5 h-5 shrink-0" style="color:var(--muted-foreground);"></i>
        <span class="flex-1 min-w-0 text-[15px] truncate" style="color:var(--foreground);">服用降压药</span>
        <span class="text-[13px] shrink-0 whitespace-nowrap" style="color:var(--muted-foreground);font-variant-numeric:tabular-nums;">20:00</span>
      </div>
      <div class="flex items-center gap-3 py-3">
        <div class="w-6 h-6 rounded-full shrink-0" role="img" aria-label="未完成" style="border:1px solid var(--border);"></div>
        <i data-lucide="moon" class="w-5 h-5 shrink-0" style="color:var(--muted-foreground);"></i>
        <span class="flex-1 min-w-0 text-[15px] truncate" style="color:var(--foreground);">睡眠记录</span>
        <span class="text-[13px] shrink-0 whitespace-nowrap" style="color:var(--muted-foreground);font-variant-numeric:tabular-nums;">22:00</span>
      </div>
    </section>

    <!-- 5. Quick Actions Row -->
    <section class="flex gap-3 mt-3">
      <button data-dom-id="cta-consult"
        class="flex items-center justify-center gap-2 h-12 rounded-full flex-1 text-[15px] font-semibold transition-[filter,transform] duration-150 ease-out hover:brightness-95 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-offset-2 motion-reduce:transition-none"
        style="background:var(--primary);color:var(--primary-foreground);--tw-ring-color:var(--ring);--tw-ring-offset-color:var(--background-100);">
        <i data-lucide="message-circle" class="w-5 h-5"></i>
        AI 问诊
      </button>
      <button data-dom-id="cta-monitor"
        class="flex items-center justify-center gap-2 h-12 rounded-full flex-1 text-[15px] font-semibold transition-[filter,transform] duration-150 ease-out hover:brightness-[0.97] active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-offset-2 motion-reduce:transition-none"
        style="background:var(--secondary);color:var(--secondary-foreground);--tw-ring-color:var(--ring);--tw-ring-offset-color:var(--background-100);">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
        健康趋势
      </button>
    </section>
    <button data-dom-id="cta-upload"
      class="flex items-center justify-center gap-2 h-12 w-full rounded-full mt-3 text-[15px] font-semibold transition-[filter,transform] duration-150 ease-out hover:brightness-[0.97] active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-offset-2 motion-reduce:transition-none"
      style="background:var(--secondary);color:var(--secondary-foreground);--tw-ring-color:var(--ring);--tw-ring-offset-color:var(--background-100);">
      <i data-lucide="upload-cloud" class="w-5 h-5"></i>
      上传分析
    </button>

  </div>

  <!-- Bottom Navigation (from partials/project-shell.html, nav-home variant) -->
  <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 z-50" style="height:49px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,0.82);border-top:0.5px solid var(--border,#e5e5ea);">
    <div class="grid grid-cols-5 h-full px-2" style="padding-bottom:env(safe-area-inset-bottom);">
      <a data-nav-key="home" data-dom-id="nav-home" data-active="true" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--brand-500,#007aff);">
        <i data-lucide="home" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-semibold whitespace-nowrap">首页</span>
      </a>
      <a data-nav-key="monitor" data-dom-id="nav-monitor" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
        <i data-lucide="activity" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">监测</span>
      </a>
      <a data-nav-key="medication" data-dom-id="nav-medication" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
        <i data-lucide="pill" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">用药</span>
      </a>
      <a data-nav-key="rehab" data-dom-id="nav-rehab" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
        <i data-lucide="dumbbell" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">康复</span>
      </a>
      <a data-nav-key="profile" data-dom-id="nav-profile" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
        <i data-lucide="user" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">我的</span>
      </a>
    </div>
  </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
