<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>康复训练</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@1.7.0/dist/umd/lucide.min.js"></script>
<style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {

  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-200);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}
</style>
<style id="semantic-token-fallback">
.bg-background{background-color:var(--background)}
.text-foreground{color:var(--foreground)}
.bg-card{background-color:var(--card)}
.text-card-foreground{color:var(--card-foreground)}
.bg-popover{background-color:var(--popover)}
.text-popover-foreground{color:var(--popover-foreground)}
.bg-primary{background-color:var(--primary)}
.text-primary-foreground{color:var(--primary-foreground)}
.bg-secondary{background-color:var(--secondary)}
.text-secondary-foreground{color:var(--secondary-foreground)}
.bg-muted{background-color:var(--muted)}
.text-muted-foreground{color:var(--muted-foreground)}
.bg-accent{background-color:var(--accent)}
.text-accent-foreground{color:var(--accent-foreground)}
.bg-destructive{background-color:var(--destructive)}
.text-destructive-foreground{color:var(--destructive-foreground)}
.border-border{border-color:var(--border)}
.border-input{border-color:var(--input)}
.bg-chart-1{background-color:var(--chart-1)}
.bg-chart-2{background-color:var(--chart-2)}
.bg-chart-3{background-color:var(--chart-3)}
.bg-chart-4{background-color:var(--chart-4)}
.bg-chart-5{background-color:var(--chart-5)}
</style>
<style type="text/tailwindcss">
@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);
  --font-sans: var(--font-sans);
  --font-serif: var(--font-serif);
  --font-mono: var(--font-mono);
  --radius-sm: 0.375rem;
  --radius-md: 0.75rem;
  --radius-lg: 1.2rem;
  --radius-xl: 1.5rem;
}
@layer base {
  body {
    background-color: var(--background-100);
    color: var(--foreground);
    font-family: var(--font-sans);
    letter-spacing: var(--tracking-normal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    margin: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
}
</style>
</head>
<body>
<main class="px-4 pt-12 pb-20">

  <header class="mb-4">
    <h1 class="text-[28px] font-semibold" style="color:var(--foreground);letter-spacing:-0.02em;text-wrap:balance;word-break:keep-all;">康复训练</h1>
    <p class="text-[14px] mt-1" style="color:var(--muted-foreground);">本周第 3 天</p>
  </header>

  <section class="rounded-[19.2px] p-5 mb-3" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
    <div class="flex flex-col items-center">
      <div class="relative" style="width:120px;height:120px;">
        <div class="absolute inset-0 rounded-full" style="background:conic-gradient(var(--state-success) 0% 60%, var(--background-200) 60% 100%);"></div>
        <div class="absolute rounded-full flex flex-col items-center justify-center" style="inset:12px;background:var(--card);">
          <span class="text-[32px] font-semibold leading-none" style="color:var(--foreground);">60%</span>
          <span class="text-[12px] mt-1" style="color:var(--muted-foreground);">本周完成度</span>
        </div>
      </div>
      <div class="flex gap-4 mt-5 w-full justify-around">
        <div class="flex flex-col items-center">
          <span class="text-[20px] font-semibold leading-none whitespace-nowrap" style="color:var(--foreground);">3/5</span>
          <span class="text-[12px] mt-1" style="color:var(--muted-foreground);">已完成</span>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[20px] font-semibold leading-none whitespace-nowrap" style="color:var(--foreground);">45</span>
          <span class="text-[12px] mt-1" style="color:var(--muted-foreground);">总分钟</span>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[20px] font-semibold leading-none whitespace-nowrap" style="color:var(--foreground);">4</span>
          <span class="text-[12px] mt-1" style="color:var(--muted-foreground);">连续天数</span>
        </div>
      </div>
    </div>
  </section>

  <section class="rounded-[19.2px] p-[18px]" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[17px] font-semibold" style="color:var(--foreground);">今日训练</h2>
      <span class="text-[13px] whitespace-nowrap" style="color:var(--muted-foreground);">2 项</span>
    </div>
    <div style="border-top:1px solid var(--border);"></div>
    <div class="flex items-center gap-3 py-3.5" style="border-bottom:1px solid var(--border);">
      <div class="flex items-center justify-center rounded-xl shrink-0" style="width:48px;height:48px;background:var(--brand-50);">
        <i data-lucide="person-standing" class="w-6 h-6" style="color:var(--brand-500);"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[15px] font-medium truncate" style="color:var(--foreground);">颈部伸展</p>
        <p class="text-[13px] truncate mt-0.5" style="color:var(--muted-foreground);">3组 × 10次 · 约8分钟</p>
        <span class="inline-flex items-center text-[11px] rounded-full px-2.5 py-0.5 mt-1.5 whitespace-nowrap" style="background:var(--background-200);color:var(--foreground);">待完成</span>
      </div>
    </div>
    <div class="flex items-center gap-3 py-3.5">
      <div class="flex items-center justify-center rounded-xl shrink-0" style="width:48px;height:48px;background:var(--state-success-surface);">
        <i data-lucide="dumbbell" class="w-6 h-6" style="color:var(--state-success);"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[15px] font-medium truncate" style="color:var(--foreground);">肩部力量训练</p>
        <p class="text-[13px] truncate mt-0.5" style="color:var(--muted-foreground);">3组 × 12次 · 约12分钟</p>
        <span class="inline-flex items-center text-[11px] rounded-full px-2.5 py-0.5 mt-1.5 whitespace-nowrap" style="background:var(--background-200);color:var(--foreground);">待完成</span>
      </div>
    </div>
  </section>

  <button data-dom-id="cta-start-exercise" class="w-full rounded-full flex items-center justify-center gap-2 transition duration-150 ease-out hover:opacity-90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 mt-4" style="height:52px;background:var(--primary);color:var(--primary-foreground);outline-color:var(--ring);">
    <i data-lucide="play" class="w-[22px] h-[22px]"></i>
    <span class="text-[16px] font-semibold">开始训练</span>
  </button>

  <section class="rounded-[19.2px] p-[18px] mt-4" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
    <h2 class="text-[17px] font-semibold mb-4" style="color:var(--foreground);">本周进度</h2>
    <div class="flex items-end gap-2" style="height:80px;">
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-t-md" style="width:24px;height:60%;background:var(--chart-2);"></div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-t-md" style="width:24px;height:80%;background:var(--chart-2);"></div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-full mb-0.5" style="width:6px;height:6px;background:var(--brand-500);"></div>
        <div class="rounded-t-md" style="width:24px;height:calc(100% - 8px);background:var(--brand-500);"></div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-t-md" style="width:24px;height:40%;background:var(--chart-2);"></div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-t-md" style="width:24px;height:4px;background:var(--background-300);"></div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-t-md" style="width:24px;height:4px;background:var(--background-300);"></div>
      </div>
      <div class="flex-1 flex flex-col items-center justify-end h-full">
        <div class="rounded-t-md" style="width:24px;height:4px;background:var(--background-300);"></div>
      </div>
    </div>
    <div class="flex gap-2 mt-2">
      <span class="flex-1 text-center text-[11px] whitespace-nowrap" style="color:var(--muted-foreground);">M</span>
      <span class="flex-1 text-center text-[11px] whitespace-nowrap" style="color:var(--muted-foreground);">T</span>
      <span class="flex-1 text-center text-[11px] font-semibold whitespace-nowrap" style="color:var(--brand-500);">W</span>
      <span class="flex-1 text-center text-[11px] whitespace-nowrap" style="color:var(--muted-foreground);">T</span>
      <span class="flex-1 text-center text-[11px] whitespace-nowrap" style="color:var(--muted-foreground);">F</span>
      <span class="flex-1 text-center text-[11px] whitespace-nowrap" style="color:var(--muted-foreground);">S</span>
      <span class="flex-1 text-center text-[11px] whitespace-nowrap" style="color:var(--muted-foreground);">S</span>
    </div>
  </section>

</main>

<nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 z-50" style="height:49px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,0.82);border-top:0.5px solid var(--border,#e5e5ea);">
  <div class="grid grid-cols-5 h-full px-2" style="padding-bottom:env(safe-area-inset-bottom);">
    <a data-nav-key="home" data-dom-id="nav-home" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
