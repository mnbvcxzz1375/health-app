/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {

  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

  /* semantic radius aliases for fill-html-head.mjs */
  --apple-radius-sm: 0.5rem;
  --apple-radius-md: 0.75rem;
  --apple-radius-lg: 1.2rem;

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-200);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

        <div class="flex gap-2 mt-4">
          <button class="h-8 px-4 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors motion-reduce:transition-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring)] focus-visible:ring-offset-2" style="background:var(--brand-500);color:var(--primary-foreground);">今日</button>
          <button class="h-8 px-4 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors motion-reduce:transition-none hover:opacity-80 active:opacity-60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring)] focus-visible:ring-offset-2" style="background:var(--secondary);color:var(--secondary-foreground);">本周</button>
          <button class="h-8 px-4 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors motion-reduce:transition-none hover:opacity-80 active:opacity-60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--ring)] focus-visible:ring-offset-2" style="background:var(--secondary);color:var(--secondary-foreground);">本月</button>
        </div>
      </div>

      <!-- Cards -->
      <div class="px-4 mt-3 flex flex-col gap-3">
        <!-- Heart Rate Card -->
        <div class="rounded-[19.2px] p-[18px]" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="heart-pulse" class="w-[18px] h-[18px]" style="color:var(--state-error);"></i>
              <span class="text-[17px] font-semibold" style="color:var(--foreground);">心率</span>
            </div>
            <span class="text-[15px] font-medium whitespace-nowrap" style="color:var(--foreground);">72 bpm</span>
          </div>
          <p class="text-[13px] mt-1" style="color:var(--muted-foreground);">最高 89 · 最低 62 · 平均 74</p>
          <div class="mt-3">
            <svg viewBox="0 0 320 120" width="100%" height="120" preserveAspectRatio="none" style="display:block;">
              <line x1="0" y1="20" x2="320" y2="20" stroke="var(--border)" stroke-width="1"/>
              <line x1="0" y1="60" x2="320" y2="60" stroke="var(--border)" stroke-width="1"/>
              <line x1="0" y1="100" x2="320" y2="100" stroke="var(--border)" stroke-width="1"/>
              <path d="M 0 95 C 21 92, 43 85, 64 80 C 85 75, 107 50, 128 40 C 149 45, 171 52, 192 55 C 213 58, 235 62, 256 65 C 277 68, 299 72, 320 75 L 320 120 L 0 120 Z" fill="var(--state-error)" fill-opacity="0.08"/>
              <path d="M 0 95 C 21 92, 43 85, 64 80 C 85 75, 107 50, 128 40 C 149 45, 171 52, 192 55 C 213 58, 235 62, 256 65 C 277 68, 299 72, 320 75" fill="none" stroke="var(--state-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="flex justify-between mt-1.5">
              <span class="text-[11px]" style="color:var(--muted-foreground);">00:00</span>
              <span class="text-[11px]" style="color:var(--muted-foreground);">06:00</span>
              <span class="text-[11px]" style="color:var(--muted-foreground);">12:00</span>
              <span class="text-[11px]" style="color:var(--muted-foreground);">18:00</span>
              <span class="text-[11px]" style="color:var(--muted-foreground);">24:00</span>
            </div>
          </div>
        </div>

        <!-- Sleep Analysis Card -->
        <div class="rounded-[19.2px] p-[18px]" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="moon" class="w-[18px] h-[18px]" style="color:var(--chart-4);"></i>
              <span class="text-[17px] font-semibold" style="color:var(--foreground);">睡眠分析</span>
            </div>
            <span class="text-[15px] font-medium whitespace-nowrap" style="color:var(--foreground);">7h 30m</span>
          </div>
          <div class="flex w-full h-8 rounded-lg overflow-hidden mt-3">
            <div style="background:var(--chart-4);width:27%;"></div>
            <div style="background:var(--chart-2);opacity:0.5;width:47%;"></div>
            <div style="background:var(--chart-3);width:20%;"></div>
            <div style="background:var(--background-400);width:6%;"></div>
          </div>
          <div class="flex flex-wrap gap-x-4 gap-y-2 mt-3">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:var(--chart-4);"></span>
              <span class="text-[12px] whitespace-nowrap" style="color:var(--muted-foreground);">深睡 2h</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:var(--chart-2);opacity:0.5;"></span>
              <span class="text-[12px] whitespace-nowrap" style="color:var(--muted-foreground);">浅睡 3.5h</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:var(--chart-3);"></span>
              <span class="text-[12px] whitespace-nowrap" style="color:var(--muted-foreground);">REM 1.5h</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:var(--background-400);"></span>
              <span class="text-[12px] whitespace-nowrap" style="color:var(--muted-foreground);">清醒 0.5h</span>
            </div>
          </div>
        </div>

        <!-- Blood Pressure Card -->
        <div class="rounded-[19.2px] p-[18px]" style="background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-xs);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="gauge" class="w-[18px] h-[18px]" style="color:var(--state-error);"></i>
              <span class="text-[17px] font-semibold" style="color:var(--foreground);">血压</span>
            </div>
            <span class="text-[15px] font-medium whitespace-nowrap" style="color:var(--foreground);">118/76</span>
          </div>
          <div class="flex items-end gap-6 mt-3">
            <div>
              <span class="text-[32px] font-semibold block" style="color:var(--foreground);font-variant-numeric:tabular-nums;line-height:1;">118</span>
              <span class="text-[12px] mt-1 block" style="color:var(--muted-foreground);">收缩压</span>
            </div>
            <div>
              <span class="text-[32px] font-semibold block" style="color:var(--foreground);font-variant-numeric:tabular-nums;line-height:1;">76</span>
              <span class="text-[12px] mt-1 block" style="color:var(--muted-foreground);">舒张压</span>
            </div>
            <div class="ml-auto pb-1">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[12px] font-medium whitespace-nowrap" style="background:var(--state-success-surface);color:var(--state-success);">正常</span>
            </div>
          </div>
          <div class="flex items-end gap-1.5 mt-4 h-10">
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:40%;"></div>
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:55%;"></div>
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:70%;"></div>
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:90%;"></div>
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:75%;"></div>
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:60%;"></div>
            <div class="flex-1 rounded-sm" style="background:var(--chart-2);height:50%;"></div>
          </div>
        </div>
      </div>
    </main>
    <!-- Bottom Navigation -->
    <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 z-50" style="height:49px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,0.82);border-top:0.5px solid var(--border,#e5e5ea);">
      <div class="grid grid-cols-5 h-full px-2" style="padding-bottom:env(safe-area-inset-bottom);">
        <a data-nav-key="home" data-dom-id="nav-home" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
          <i data-lucide="home" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">首页</span>
        </a>
        <a data-nav-key="monitor" data-dom-id="nav-monitor" data-active="true" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--brand-500,#007aff);">
          <i data-lucide="activity" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-semibold whitespace-nowrap">监测</span>
        </a>
        <a data-nav-key="medication" data-dom-id="nav-medication" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
          <i data-lucide="pill" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">用药</span>
        </a>
        <a data-nav-key="rehab" data-dom-id="nav-rehab" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
          <i data-lucide="dumbbell" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">康复</span>
        </a>
        <a data-nav-key="profile" data-dom-id="nav-profile" class="flex flex-col items-center justify-center gap-0.5" style="min-width:44px;min-height:44px;color:var(--muted-foreground,#8e8e93);">
          <i data-lucide="user" class="w-[22px] h-[22px]"></i><span class="text-[10px] font-medium whitespace-nowrap">我的</span>
        </a>
      </div>
    </nav>
    <script>lucide.createIcons();</script>
</body>
</html>
