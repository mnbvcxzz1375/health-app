# YOLOv13 with DINOv3 backbone and DFAD (Domain-aware Diffusion Feature) enhancements
# DFAD innovations: DDFPlusPlus, Feature Alignment, Cross-Scale Consistency, Robustness Augmentation
# Configuration for ablation study: all innovations enabled by default
# P2 FULL channels ablation variant

# DFAD Innovation Flags (set False to disable respective innovations in training)
dfad_enable_ddfpp: true              # Enable Domain-aware Diffusion Feature Plus Plus (DDFPlusPlus)
dfad_enable_alignment: true           # Enable multi-scale feature alignment
dfad_enable_consistency: true         # Enable cross-scale consistency loss
dfad_enable_robustness: true          # Enable robustness augmentation during training

nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]   # Nano
  s: [0.50, 0.50, 1024]   # Small
  l: [1.00, 1.00, 512]    # Large
  x: [1.00, 1.50, 512]    # Extra Large

backbone:
  # [from, repeats, module, args]
  # YOLOv13 with YOLOv3-inspired darknet backbone
  - [-1, 1, Conv, [32, 3, 1]]       # 0
  - [-1, 1, Conv, [64, 3, 2]]       # 1-P1/2
  - [-1, 1, Bottleneck, [64]]       # 2
  - [-1, 1, Conv, [128, 3, 2]]      # 3-P2/4
  - [-1, 2, Bottleneck, [128]]      # 4
  - [-1, 1, Conv, [256, 3, 2]]      # 5-P3/8
  - [-1, 8, Bottleneck, [256]]      # 6: Standard P3 processing

  # DINOv3 enhancement at P3 level (256 channels) - focus on small objects
  - [-1, 1, DINO3BackboneAdapter, ['dinov3_vitb16', True, 256, 896]]  # 7: DINOv3 enhanced P3 features (dino_input_size=896, decoupled from YOLO resolution)

  # DFAD modules inserted on P3 path after DINOv3 injection
  - [[6, -1], 1, FeatureAlignmentLayerPP, []]                  # 8: ViT-CNN alignment (Align++ first per plan)
  - [-1, 1, DDFPlusPlusDCT, [256]]                           # 9: DCT-based frequency enhancement
  - [-1, 1, RobustnessAugmentor, [0.1]]                   # 10: Robustness-aware augmentation module (augment_strength=0.1)

  - [-1, 1, Conv, [512, 3, 2]]      # 11-P4/16
  - [-1, 8, Bottleneck, [512]]      # 12: Standard P4 processing (no DINO3)
  - [-1, 1, Conv, [1024, 3, 2]]     # 13-P5/32
  - [-1, 4, Bottleneck, [1024]]     # 14

head:
  # YOLOv13 head with DINO3-enhanced P3 features for improved small object detection

  # P5 processing (large objects)
  - [-1, 1, Bottleneck, [1024, False]]     # 15
  - [-1, 1, Conv, [512, 1, 1]]             # 16
  - [-1, 1, Conv, [1024, 3, 1]]            # 17
  - [-1, 1, Conv, [512, 1, 1]]             # 18
  - [-1, 1, Conv, [1024, 3, 1]]            # 19 (P5/32-large)

  # P4 branch (medium objects) - standard processing
  - [-2, 1, Conv, [256, 1, 1]]             # 20
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 12], 1, Concat, [1]]             # 22: cat standard P4 features (256+512=768ch)
  - [-1, 1, Conv, [512, 1, 1]]             # 23: reduce channels to 512
  - [-1, 1, Bottleneck, [512, False]]      # 24
  - [-1, 1, Conv, [256, 1, 1]]             # 25
  - [-1, 1, Conv, [512, 3, 1]]             # 26 (P4/16-medium)

  # P3 branch (small objects) - uses DINO3-enhanced P3 features
  - [-2, 1, Conv, [128, 1, 1]]             # 27
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 28
  - [[-1, 10], 1, Concat, [1]]             # 29: cat DFAD-refined P3 features (128+256=384ch)
  - [-1, 1, Conv, [256, 1, 1]]             # 30: reduce channels to 256
  - [-1, 1, Bottleneck, [256, False]]      # 31
  - [-1, 1, Bottleneck, [256, False]]      # 32 (P3/8-small, DFAD-refined)

  # P2 branch (tiny objects) - FULL channels (ablation: P2 with full C instead of C/2)
  - [-1, 1, Conv, [128, 1, 1]]               # 33: Reduce P3 channels from 256 to 128
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 34: Upsample to P2 resolution
  - [[-1, 4], 1, Concat, [1]]                # 35: Concat with backbone P2 (128+128=256ch)
  - [-1, 1, Conv, [256, 1, 1]]               # 36: Keep at full C=256
  - [-1, 1, Bottleneck, [256, False]]        # 37 (P2/4-tiny, full channels)

  # P3 -> P4 connection
  - [-6, 1, Conv, [256, 3, 2]]             # 38: Downsample DFAD-refined P3
  - [[-1, 26], 1, Concat, [1]]             # 39: Concat with standard P4 (256+512=768ch)
  - [-1, 1, Conv, [512, 3, 1]]             # 40: Process -> 512ch (final P4)

  # P4 -> P5 connection
  - [-1, 1, Conv, [512, 3, 2]]             # 41: Downsample P4 to P5
  - [[-1, 19], 1, Concat, [1]]             # 42: Concat with P5 (512+1024=1536ch)
  - [-1, 1, Conv, [1024, 3, 1]]            # 43: Process -> 1024ch (final P5)

  # Detection heads - P2 FULL channels, P3 DFAD-enhanced, P4 and P5 standard
  - [[37, 32, 40, 43], 1, Detect, [nc]]    # 44: Detect(P2, P3, P4, P5)
