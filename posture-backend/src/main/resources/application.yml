server:
  port: 8080

spring:
  application:
    name: posture-backend
  datasource:
    url: ${POSTURE_DB_URL:jdbc:mysql://127.0.0.1:3306/health_monitoring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${POSTURE_DB_USERNAME:root}
    password: ${POSTURE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    url: ${POSTURE_REDIS_URL:redis://127.0.0.1:6379/0}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

posture:
  storage:
    root-directory: ../runtime-data
  inference:
    base-url: http://localhost:8000
    connect-timeout-ms: 3000
    read-timeout-ms: 600000
  queue:
    redis-key: posture:jobs
  llm:
    enabled: false
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    timeout-ms: 15000
    api-key:

management:
  endpoints:
    web:
      exposure:
        include: health,info

